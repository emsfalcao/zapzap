app-id: com.rtosta.zapzap
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.11"
command: zapzap
finish-args:
  - "--share=ipc"
  - "--socket=wayland"
  - "--socket=fallback-x11"
  - "--socket=pulseaudio"
  - "--share=network"
  - "--filesystem=xdg-run/pipewire-0"
  - "--device=all"
  - "--filesystem=xdg-download"
  - "--talk-name=org.freedesktop.Notifications"
  - "--talk-name=org.kde.StatusNotifierWatcher"
  - "--env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess"
  - "--env=QTWEBENGINE_DICTIONARIES_PATH=/app/qtwebengine_dictionaries"

cleanup:
  - /include
  - /lib/pkgconfig
  - "*.la"
  - "*.a"
cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  build-args:
    - --share=network
modules:
  # Build dependencies
  - name: python-build-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} setuptools wheel
    sources: []

  # Zapzap wheel build
  # Fork FalcaoNet: dicionários do corretor convertidos no build (sem download em tempo de execução)
  - name: dicionarios
    buildsystem: simple
    build-commands:
      - |
        set -e
        CONV=$(command -v qwebengine_convert_dict || ls /app/lib/qt6/libexec/qwebengine_convert_dict /usr/lib/x86_64-linux-gnu/qt6/libexec/qwebengine_convert_dict /usr/lib/qt6/libexec/qwebengine_convert_dict 2>/dev/null | head -1)
        test -x "$CONV" || { echo "qwebengine_convert_dict não encontrado"; exit 1; }
        mkdir -p ${FLATPAK_DEST}/qtwebengine_dictionaries
        "$CONV" pt_BR.dic ${FLATPAK_DEST}/qtwebengine_dictionaries/pt-BR.bdic
        "$CONV" en_US.dic ${FLATPAK_DEST}/qtwebengine_dictionaries/en-US.bdic
        ls -la ${FLATPAK_DEST}/qtwebengine_dictionaries
    sources:
      - type: file
        path: dictionaries/pt_BR.dic
      - type: file
        path: dictionaries/pt_BR.aff
      - type: file
        path: dictionaries/en_US.dic
      - type: file
        path: dictionaries/en_US.aff
  - name: zapzap
    buildsystem: simple
    build-commands:
      - |
        cat > zapzap/BuildInfo.py << EOF
        BUILD_CHANNEL = "Fork"
        BUILD_PROVIDER = "emsfalcao/zapzap (FalcaoNet)"
        BUILD_REPOSITORY = "emsfalcao/zapzap"
        BUILD_PACKAGING = "Flatpak"
        EOF

      # Gera o wheel antes
      - python3 -m build --wheel --no-isolation
      # Instala o wheel dentro do Flatpak
      - pip3 install --prefix=${FLATPAK_DEST} dist/zapzap-*.whl
      # Instala os assets
      - install -Dm644 share/icons/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 share/applications/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 share/metainfo/${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.appdata.xml
    sources:
      - type: dir
        path: ..
